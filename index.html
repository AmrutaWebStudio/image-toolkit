<!DOCTYPE html>
<html>
<head>
  <title>Amruta Image Toolkit</title>
</head>
<body>
  <h1>Image Toolkit — Compress</h1>

  <p>Select an image:</p>
  <input type="file" id="fileInput" accept="image/*">

  <br><br>
  <label for="quality">Manual quality: </label>
  <input type="range" id="quality" min="10" max="100" value="80">
  <span id="qualityValue">80</span>%

  <br><br>
  <label for="targetSize">Or target a file size (KB): </label>
  <input type="number" id="targetSize" placeholder="e.g. 200" min="1">
  <button id="targetButton">Compress to this size</button>

  <br><br>
  <p id="originalSize"></p>
  <p id="compressedSize"></p>
  <p id="statusText"></p>

  <br>
  <img id="preview" style="max-width: 400px; border: 1px solid #ccc; display: none;">

  <br><br>
  <a id="downloadLink" style="display: none;">
    <button>Download compressed image</button>
  </a>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const fileInput = document.getElementById('fileInput');
    const qualitySlider = document.getElementById('quality');
    const qualityValue = document.getElementById('qualityValue');
    const targetSizeInput = document.getElementById('targetSize');
    const targetButton = document.getElementById('targetButton');
    const preview = document.getElementById('preview');
    const originalSizeText = document.getElementById('originalSize');
    const compressedSizeText = document.getElementById('compressedSize');
    const statusText = document.getElementById('statusText');
    const downloadLink = document.getElementById('downloadLink');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let currentImage = null;

    function formatBytes(bytes) {
      return (bytes / 1024).toFixed(1) + ' KB';
    }

    // Returns a Promise so we can "wait" for the compressed result
    function compressAtQuality(quality) {
      return new Promise((resolve) => {
        canvas.width = currentImage.width;
        canvas.height = currentImage.height;
        ctx.drawImage(currentImage, 0, 0);
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
      });
    }

    function showResult(blob, qualityUsed) {
      const url = URL.createObjectURL(blob);
      preview.src = url;
      preview.style.display = 'block';
      compressedSizeText.textContent = 'Compressed size: ' + formatBytes(blob.size) +
        ' (quality used: ' + Math.round(qualityUsed * 100) + '%)';
      downloadLink.href = url;
      downloadLink.download = 'compressed-image.jpg';
      downloadLink.style.display = 'inline-block';
    }

    async function compressAndShow() {
      if (!currentImage) return;
      const quality = qualitySlider.value / 100;
      const blob = await compressAtQuality(quality);
      showResult(blob, quality);
      statusText.textContent = '';
    }

    async function compressToTargetSize() {
      if (!currentImage) return;
      const targetKB = parseFloat(targetSizeInput.value);
      if (!targetKB || targetKB <= 0) {
        statusText.textContent = 'Please enter a valid target size in KB.';
        return;
      }
      const targetBytes = targetKB * 1024;

      statusText.textContent = 'Searching for the best quality...';

      let low = 0.05;
      let high = 1.0;
      let bestBlob = null;
      let bestQuality = low;

      // Try up to 8 times, narrowing in on the right quality level
      for (let i = 0; i < 8; i++) {
        const mid = (low + high) / 2;
        const blob = await compressAtQuality(mid);

        if (blob.size <= targetBytes) {
          bestBlob = blob;
          bestQuality = mid;
          low = mid; // try for slightly higher quality next time
        } else {
          high = mid; // too big, need lower quality
        }
      }

      if (bestBlob) {
        showResult(bestBlob, bestQuality);
        statusText.textContent = 'Done — got it under ' + targetKB + ' KB.';
      } else {
        // Couldn't get under target even at lowest quality
        const blob = await compressAtQuality(0.05);
        showResult(blob, 0.05);
        statusText.textContent = 'Could not reach ' + targetKB +
          ' KB even at lowest quality. This is the smallest possible result — try reducing the image dimensions instead.';
      }
    }

    fileInput.addEventListener('change', function() {
      const file = fileInput.files[0];
      if (!file) return;

      originalSizeText.textContent = 'Original size: ' + formatBytes(file.size);

      const img = new Image();
      img.onload = function() {
        currentImage = img;
        compressAndShow();
      };
      img.src = URL.createObjectURL(file);
    });

    qualitySlider.addEventListener('input', function() {
      qualityValue.textContent = qualitySlider.value;
      compressAndShow();
    });

    targetButton.addEventListener('click', compressToTargetSize);
  </script>
</body>
</html>
