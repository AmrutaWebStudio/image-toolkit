<!DOCTYPE html>
<html>
<head>
  <title>Amruta Image Toolkit</title>
</head>
<body>
  <h1>Image Toolkit — Compress</h1>

  <p>Select an image:</p>
  <input type="file" id="fileInput" accept="image/*">

  <br><br>
  <label for="quality">Quality: </label>
  <input type="range" id="quality" min="10" max="100" value="80">
  <span id="qualityValue">80</span>%

  <br><br>
  <p id="originalSize"></p>
  <p id="compressedSize"></p>

  <br>
  <img id="preview" style="max-width: 400px; border: 1px solid #ccc; display: none;">

  <br><br>
  <a id="downloadLink" style="display: none;">
    <button>Download compressed image</button>
  </a>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const fileInput = document.getElementById('fileInput');
    const qualitySlider = document.getElementById('quality');
    const qualityValue = document.getElementById('qualityValue');
    const preview = document.getElementById('preview');
    const originalSizeText = document.getElementById('originalSize');
    const compressedSizeText = document.getElementById('compressedSize');
    const downloadLink = document.getElementById('downloadLink');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let currentImage = null;

    function formatBytes(bytes) {
      return (bytes / 1024).toFixed(1) + ' KB';
    }

    function compressAndShow() {
      if (!currentImage) return;

      canvas.width = currentImage.width;
      canvas.height = currentImage.height;
      ctx.drawImage(currentImage, 0, 0);

      const quality = qualitySlider.value / 100;

      canvas.toBlob(function(blob) {
        const compressedURL = URL.createObjectURL(blob);
        preview.src = compressedURL;
        preview.style.display = 'block';

        compressedSizeText.textContent = 'Compressed size: ' + formatBytes(blob.size);

        downloadLink.href = compressedURL;
        downloadLink.download = 'compressed-image.jpg';
        downloadLink.style.display = 'inline-block';
      }, 'image/jpeg', quality);
    }

    fileInput.addEventListener('change', function() {
      const file = fileInput.files[0];
      if (!file) return;

      originalSizeText.textContent = 'Original size: ' + formatBytes(file.size);

      const img = new Image();
      img.onload = function() {
        currentImage = img;
        compressAndShow();
      };
      img.src = URL.createObjectURL(file);
    });

    qualitySlider.addEventListener('input', function() {
      qualityValue.textContent = qualitySlider.value;
      compressAndShow();
    });
  </script>
</body>
</html>
