<!DOCTYPE html>
<html>
<head>
  <title>Amruta Image Toolkit</title>
</head>
<body>
  <h1>Image Toolkit — Compress &amp; Resize</h1>

  <p>Select an image:</p>
  <input type="file" id="fileInput" accept="image/*">

  <br><br>
  <h3>Resize</h3>
  <label for="widthInput">Width (px): </label>
  <input type="number" id="widthInput" min="1">
  &nbsp;&nbsp;
  <label for="heightInput">Height (px): </label>
  <input type="number" id="heightInput" min="1">
  <br><br>
  <label>
    <input type="checkbox" id="lockAspect" checked>
    Lock aspect ratio
  </label>
  <br><br>
  <button id="applyResizeButton">Apply resize</button>
  <button id="resetSizeButton">Reset to original size</button>
  <p id="resizeStatus"></p>

  <br>
  <h3>Compress</h3>
  <label for="quality">Manual quality: </label>
  <input type="range" id="quality" min="10" max="100" value="80">
  <span id="qualityValue">80</span>%

  <br><br>
  <label for="targetSize">Or target a file size (KB): </label>
  <input type="number" id="targetSize" placeholder="e.g. 200" min="1">
  <button id="targetButton">Compress to this size</button>

  <br><br>
  <p id="originalSize"></p>
  <p id="compressedSize"></p>
  <p id="statusText"></p>

  <br>
  <img id="preview" style="max-width: 400px; border: 1px solid #ccc; display: none;">

  <br><br>
  <a id="downloadLink" style="display: none;">
    <button>Download result</button>
  </a>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const fileInput = document.getElementById('fileInput');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const lockAspect = document.getElementById('lockAspect');
    const applyResizeButton = document.getElementById('applyResizeButton');
    const resetSizeButton = document.getElementById('resetSizeButton');
    const resizeStatus = document.getElementById('resizeStatus');

    const qualitySlider = document.getElementById('quality');
    const qualityValue = document.getElementById('qualityValue');
    const targetSizeInput = document.getElementById('targetSize');
    const targetButton = document.getElementById('targetButton');
    const preview = document.getElementById('preview');
    const originalSizeText = document.getElementById('originalSize');
    const compressedSizeText = document.getElementById('compressedSize');
    const statusText = document.getElementById('statusText');
    const downloadLink = document.getElementById('downloadLink');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let currentImage = null;
    let originalFileSize = 0;
    let originalWidth = 0;
    let originalHeight = 0;
    let workingWidth = 0;
    let workingHeight = 0;

    function formatBytes(bytes) {
      return (bytes / 1024).toFixed(1) + ' KB';
    }

    function compressAtQuality(quality) {
      return new Promise((resolve) => {
        canvas.width = workingWidth;
        canvas.height = workingHeight;
        ctx.drawImage(currentImage, 0, 0, workingWidth, workingHeight);
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
      });
    }

    function showResult(blob, qualityUsed) {
      const url = URL.createObjectURL(blob);
      preview.src = url;
      preview.style.display = 'block';
      compressedSizeText.textContent = 'Result size: ' + formatBytes(blob.size) +
        ' (' + workingWidth + '×' + workingHeight + 'px, quality used: ' + Math.round(qualityUsed * 100) + '%)';
      downloadLink.href = url;
      downloadLink.download = 'result-image.jpg';
      downloadLink.style.display = 'inline-block';
    }

    async function compressAndShow() {
      if (!currentImage) return;
      const quality = qualitySlider.value / 100;
      const blob = await compressAtQuality(quality);
      showResult(blob, quality);
      statusText.textContent = '';
    }

    async function compressToTargetSize() {
      if (!currentImage) return;
      const targetKB = parseFloat(targetSizeInput.value);
      if (!targetKB || targetKB <= 0) {
        statusText.textContent = 'Please enter a valid target size in KB.';
        return;
      }
      const targetBytes = targetKB * 1024;
      statusText.textContent = 'Searching for the best quality...';

      let low = 0.05;
      let high = 1.0;
      let bestBlob = null;
      let bestQuality = low;

      for (let i = 0; i < 8; i++) {
        const mid = (low + high) / 2;
        const blob = await compressAtQuality(mid);
        if (blob.size <= targetBytes) {
          bestBlob = blob;
          bestQuality = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      if (bestBlob && bestBlob.size < originalFileSize) {
        showResult(bestBlob, bestQuality);
        statusText.textContent = 'Done — got it under ' + targetKB + ' KB.';
      } else if (bestBlob) {
        statusText.textContent = 'Your original file (' + formatBytes(originalFileSize) +
          ') is already smaller than anything we can re-compress it to — no need to compress this one.';
      } else {
        const blob = await compressAtQuality(0.05);
        showResult(blob, 0.05);
        statusText.textContent = 'Could not reach ' + targetKB +
          ' KB even at lowest quality. This is the smallest possible result — try reducing the image dimensions instead.';
      }
    }

    function applyResize() {
      const newWidth = parseInt(widthInput.value);
      const newHeight = parseInt(heightInput.value);
      if (!newWidth || !newHeight || newWidth <= 0 || newHeight <= 0) {
        resizeStatus.textContent = 'Please enter valid width and height values.';
        return;
      }
      workingWidth = newWidth;
      workingHeight = newHeight;
      resizeStatus.textContent = 'Resized to ' + workingWidth + '×' + workingHeight + 'px.';
      compressAndShow();
    }

    function resetSize() {
      workingWidth = originalWidth;
      workingHeight = originalHeight;
      widthInput.value = originalWidth;
      heightInput.value = originalHeight;
      resizeStatus.textContent = 'Reset to original size (' + originalWidth + '×' + originalHeight + 'px).';
      compressAndShow();
    }

    fileInput.addEventListener('change', function() {
      const file = fileInput.files[0];
      if (!file) return;

      originalFileSize = file.size;
      originalSizeText.textContent = 'Original size: ' + formatBytes(file.size);

      const img = new Image();
      img.onload = function() {
        currentImage = img;
        originalWidth = img.width;
        originalHeight = img.height;
        workingWidth = img.width;
        workingHeight = img.height;
        widthInput.value = img.width;
        heightInput.value = img.height;
        resizeStatus.textContent = '';
        compressAndShow();
      };
      img.src = URL.createObjectURL(file);
    });

    widthInput.addEventListener('input', function() {
      if (lockAspect.checked && originalWidth && originalHeight) {
        const ratio = originalHeight / originalWidth;
        heightInput.value = Math.round(widthInput.value * ratio);
      }
    });

    heightInput.addEventListener('input', function() {
      if (lockAspect.checked && originalWidth && originalHeight) {
        const ratio = originalWidth / originalHeight;
        widthInput.value = Math.round(heightInput.value * ratio);
      }
    });

    applyResizeButton.addEventListener('click', applyResize);
    resetSizeButton.addEventListener('click', resetSize);

    qualitySlider.addEventListener('input', function() {
      qualityValue.textContent = qualitySlider.value;
      compressAndShow();
    });

    targetButton.addEventListener('click', compressToTargetSize);
  </script>
</body>
</html>
