<!DOCTYPE html>
<html>
<head>
  <title>Images to PDF — Amruta Image Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    :root {
      --dark: #1A252B;
      --green: #04A168;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      color: var(--dark);
      background: #ffffff;
    }
    a.back-link {
      display: inline-block;
      color: #55606a;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 16px;
    }
    a.back-link:hover { color: var(--green); }
    h1 { font-size: 24px; margin: 8px 0 4px; }
    .tagline {
      color: #55606a;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .privacy-note {
      background: #f0faf5;
      border: 1px solid #cfeee0;
      color: #0c5a3b;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 28px;
    }
    h3 {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #55606a;
      margin: 28px 0 10px;
    }
    select {
      padding: 6px 8px;
      border: 1px solid #d5dade;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: var(--green);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary {
      background: #eef0f1;
      color: var(--dark);
    }
    .info-box {
      font-size: 14px;
      color: #0c4a8a;
      background: #eaf3fc;
      border: 1px solid #cfe3f7;
      padding: 10px 14px;
      border-radius: 8px;
      margin: 14px 0;
      display: none;
    }
    #pageList { margin-top: 14px; }
    .page-row {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #e2e5e7;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .page-row img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #e2e5e7;
      flex-shrink: 0;
    }
    .page-info {
      flex: 1;
      min-width: 0;
    }
    .page-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-meta {
      font-size: 12px;
      color: #55606a;
    }
    .row-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .row-buttons button {
      background: #eef0f1;
      color: var(--dark);
      padding: 6px 10px;
      font-size: 14px;
    }
    .row-buttons button.remove { color: #b3261e; }
    .status {
      font-size: 13px;
      color: #55606a;
      margin-top: 10px;
      text-align: center;
    }
    .action-row {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    #resultWrap { display: none; margin-top: 24px; }
    .result-box {
      background: #f0faf5;
      border: 1px solid #cfeee0;
      color: #0c5a3b;
      font-size: 14px;
      padding: 12px 14px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <a class="back-link" href="index.html">← Back to all tools</a>

  <h1>Images to PDF</h1>
  <p class="tagline">
    Combine one or more images into a single PDF document.
  </p>
  <div class="privacy-note">
    🔒 Your images are processed entirely on your device. Nothing is uploaded anywhere.
  </div>

  <p>Select images (you can pick several at once):</p>
  <input type="file" id="fileInput" accept="image/*" multiple>

  <div class="info-box" id="infoBox"></div>

  <div id="listWrap" style="display:none;">
    <h3>Pages</h3>
    <div id="pageList"></div>

    <h3>Page style</h3>
    <select id="pageStyle">
      <option value="a4">A4 page (image centered with a margin)</option>
      <option value="fit">Fit to image (page matches each image)</option>
    </select>

    <div class="action-row">
      <button id="createButton">Create PDF</button>
      <button class="secondary" id="clearButton">Clear all</button>
    </div>
    <p class="status" id="workStatus"></p>
  </div>

  <div id="resultWrap">
    <div class="result-box" id="resultInfo"></div>
    <div class="action-row">
      <button id="saveButton">⬇ Save PDF</button>
      <button id="shareButton">📤 Share</button>
    </div>
    <p class="status" id="shareNote"></p>
  </div>

  <script>
    const MAX_SIDE = 2000;       // longest side of each image inside the PDF
    const JPEG_QUALITY = 0.85;
    const A4_W = 595.28;
    const A4_H = 841.89;
    const MARGIN = 24;

    const fileInput = document.getElementById('fileInput');
    const infoBox = document.getElementById('infoBox');
    const listWrap = document.getElementById('listWrap');
    const pageList = document.getElementById('pageList');
    const pageStyle = document.getElementById('pageStyle');
    const createButton = document.getElementById('createButton');
    const clearButton = document.getElementById('clearButton');
    const workStatus = document.getElementById('workStatus');
    const resultWrap = document.getElementById('resultWrap');
    const resultInfo = document.getElementById('resultInfo');
    const saveButton = document.getElementById('saveButton');
    const shareButton = document.getElementById('shareButton');
    const shareNote = document.getElementById('shareNote');

    let items = [];        // { file, url }
    let pdfBlob = null;

    function showInfo(text) {
      infoBox.textContent = text;
      infoBox.style.display = text ? 'block' : 'none';
    }

    function makeFileName() {
      const d = new Date();
      const pad = function(n) { return String(n).padStart(2, '0'); };
      return 'document-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
             '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.pdf';
    }

    function formatBytes(bytes) {
      if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return Math.round(bytes / 1024) + ' KB';
    }

    /* ---------- Page list ---------- */

    function renderList() {
      pageList.innerHTML = '';
      items.forEach(function(item, i) {
        const row = document.createElement('div');
        row.className = 'page-row';

        const thumb = document.createElement('img');
        thumb.src = item.url;
        thumb.alt = '';

        const info = document.createElement('div');
        info.className = 'page-info';
        const name = document.createElement('div');
        name.className = 'page-name';
        name.textContent = (i + 1) + '. ' + item.file.name;
        const meta = document.createElement('div');
        meta.className = 'page-meta';
        meta.textContent = formatBytes(item.file.size);
        info.appendChild(name);
        info.appendChild(meta);

        const buttons = document.createElement('div');
        buttons.className = 'row-buttons';

        const up = document.createElement('button');
        up.textContent = '↑';
        up.title = 'Move up';
        up.disabled = i === 0;
        up.addEventListener('click', function() { move(i, -1); });

        const down = document.createElement('button');
        down.textContent = '↓';
        down.title = 'Move down';
        down.disabled = i === items.length - 1;
        down.addEventListener('click', function() { move(i, 1); });

        const del = document.createElement('button');
        del.textContent = '✕';
        del.title = 'Remove';
        del.className = 'remove';
        del.addEventListener('click', function() { removeAt(i); });

        buttons.appendChild(up);
        buttons.appendChild(down);
        buttons.appendChild(del);

        row.appendChild(thumb);
        row.appendChild(info);
        row.appendChild(buttons);
        pageList.appendChild(row);
      });

      listWrap.style.display = items.length ? 'block' : 'none';
      createButton.textContent = items.length > 1
        ? 'Create PDF (' + items.length + ' pages)'
        : 'Create PDF';
    }

    function move(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= items.length) return;
      const tmp = items[index];
      items[index] = items[target];
      items[target] = tmp;
      invalidateResult();
      renderList();
    }

    function removeAt(index) {
      URL.revokeObjectURL(items[index].url);
      items.splice(index, 1);
      invalidateResult();
      renderList();
    }

    function invalidateResult() {
      pdfBlob = null;
      resultWrap.style.display = 'none';
    }

    fileInput.addEventListener('change', function() {
      const files = Array.from(fileInput.files);
      let skipped = 0;
      files.forEach(function(file) {
        if (file.type && file.type.indexOf('image/') === 0) {
          items.push({ file: file, url: URL.createObjectURL(file) });
        } else {
          skipped++;
        }
      });
      fileInput.value = '';   // lets you pick the same file again later
      showInfo(skipped ? skipped + ' file(s) skipped because they are not images.' : '');
      invalidateResult();
      renderList();
    });

    clearButton.addEventListener('click', function() {
      items.forEach(function(item) { URL.revokeObjectURL(item.url); });
      items = [];
      workStatus.textContent = '';
      showInfo('');
      invalidateResult();
      renderList();
    });

    /* ---------- Building the PDF ---------- */

    // Loads an image, shrinks it if needed, and returns JPEG bytes + size
    function prepareImage(file) {
      return new Promise(function(resolve, reject) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = function() {
          const s = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * s));
          const h = Math.max(1, Math.round(img.height * s));

          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const cctx = c.getContext('2d');
          cctx.fillStyle = '#ffffff';       // JPEG has no transparency
          cctx.fillRect(0, 0, w, h);
          cctx.drawImage(img, 0, 0, w, h);

          c.toBlob(function(blob) {
            URL.revokeObjectURL(url);
            if (!blob) { reject(new Error('encode')); return; }
            blob.arrayBuffer().then(function(buf) {
              resolve({ bytes: buf, width: w, height: h });
            });
          }, 'image/jpeg', JPEG_QUALITY);
        };
        img.onerror = function() {
          URL.revokeObjectURL(url);
          reject(new Error('decode:' + file.name));
        };
        img.src = url;
      });
    }

    async function buildPdf() {
      const pdf = await PDFLib.PDFDocument.create();
      const style = pageStyle.value;

      for (let i = 0; i < items.length; i++) {
        workStatus.textContent = 'Adding page ' + (i + 1) + ' of ' + items.length + '…';
        await new Promise(function(r) { setTimeout(r, 0); });   // let the screen update

        const prepared = await prepareImage(items[i].file);
        const jpg = await pdf.embedJpg(prepared.bytes);

        if (style === 'fit') {
          const page = pdf.addPage([prepared.width, prepared.height]);
          page.drawImage(jpg, { x: 0, y: 0, width: prepared.width, height: prepared.height });
        } else {
          // A4, choosing portrait or landscape to suit the image
          const landscape = prepared.width > prepared.height;
          const pw = landscape ? A4_H : A4_W;
          const ph = landscape ? A4_W : A4_H;
          const boxW = pw - MARGIN * 2;
          const boxH = ph - MARGIN * 2;
          const k = Math.min(boxW / prepared.width, boxH / prepared.height);
          const dw = prepared.width * k;
          const dh = prepared.height * k;
          const page = pdf.addPage([pw, ph]);
          page.drawImage(jpg, {
            x: (pw - dw) / 2,
            y: (ph - dh) / 2,
            width: dw,
            height: dh
          });
        }
      }

      const bytes = await pdf.save();
      return new Blob([bytes], { type: 'application/pdf' });
    }

    createButton.addEventListener('click', async function() {
      if (!items.length) return;
      if (typeof PDFLib === 'undefined') {
        workStatus.textContent = 'The PDF library could not be loaded. Check your internet connection and reload the page.';
        return;
      }
      createButton.disabled = true;
      clearButton.disabled = true;
      invalidateResult();
      try {
        pdfBlob = await buildPdf();
        workStatus.textContent = '';
        resultInfo.textContent = '✅ Your PDF is ready — ' + items.length +
          (items.length === 1 ? ' page · ' : ' pages · ') + formatBytes(pdfBlob.size);
        resultWrap.style.display = 'block';
        resultWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        const msg = String(err && err.message || '');
        if (msg.indexOf('decode:') === 0) {
          workStatus.textContent = 'Could not read "' + msg.slice(7) + '". Remove it and try again — some formats (like certain iPhone HEIC files) may not open in this browser.';
        } else {
          workStatus.textContent = 'Something went wrong while creating the PDF. Try fewer or smaller images.';
        }
      }
      createButton.disabled = false;
      clearButton.disabled = false;
    });

    pageStyle.addEventListener('change', invalidateResult);

    /* ---------- Save & Share ---------- */

    saveButton.addEventListener('click', function() {
      if (!pdfBlob) return;
      const url = URL.createObjectURL(pdfBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = makeFileName();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function() { URL.revokeObjectURL(url); }, 10000);
    });

    shareButton.addEventListener('click', async function() {
      if (!pdfBlob) return;
      const file = new File([pdfBlob], makeFileName(), { type: 'application/pdf' });
      try {
        await navigator.share({ files: [file], title: 'PDF document' });
      } catch (err) {
        if (err.name !== 'AbortError') {
          shareNote.textContent = 'Sharing did not work here. Use Save PDF instead.';
        }
      }
    });

    (function() {
      try {
        const test = new File(['x'], 't.pdf', { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [test] })) return;
      } catch (e) {}
      shareButton.style.display = 'none';
      shareNote.textContent = "This browser can't open the share menu, so use Save PDF.";
    })();
  </script>
</body>
</html>
